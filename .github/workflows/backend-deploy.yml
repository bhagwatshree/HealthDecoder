name: Backend deploy

on:
  pull_request:
    branches: [master]
    paths: ['backend/**']
  push:
    branches: [master]
    paths: ['backend/**']
  workflow_dispatch:
    inputs:
      monitoring_mode:
        description: 'CloudWatch monitoring (alarms + Neon monitor). "unchanged" keeps whatever the stack has.'
        type: choice
        required: false
        default: unchanged
        options:
          - unchanged
          - active
          - sleep

# Cancel an in-flight run if a new one starts on the same branch — avoids two deploys racing.
concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every PR and push — validates the Lambda actually bundles (esbuild) before anything
  # is considered for deploy. No AWS credentials needed for this job.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - uses: aws-actions/setup-sam@v2
      # SAM's esbuild bundler looks for `esbuild` on PATH, not in node_modules — without this
      # it fails with "Cannot find esbuild" even though npm ci just installed it locally.
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: sam build

  # On a real push to master, or a manual run via the Actions tab (not PRs) — deploys the
  # already-validated build, then a lightweight smoke test confirms the live API responds.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # required for OIDC — no AWS keys stored anywhere
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - uses: aws-actions/setup-sam@v2
      # Same PATH fix as the build job above — see comment there.
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::405114130882:role/github-actions-medical-scanner-deploy
          aws-region: us-east-1
      - run: sam build
      - name: Generate deploy config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FREE_TIER_DAILY_LIMIT: ${{ secrets.FREE_TIER_DAILY_LIMIT }}
          # Monitoring (all optional — gen-samconfig.js omits any that are unset, so CloudFormation
          # keeps the stack's existing value rather than blanking it). ALERT_EMAIL is the one worth
          # setting first: without a subscriber the alarms still evaluate, but notify nobody.
          #
          # MONITORING_MODE resolves to '' on a normal push and on a dispatch left at "unchanged",
          # so ordinary deploys never flip monitoring on or off by accident — only an explicit
          # choice in the Actions tab does. Chosen over a repo secret because it isn't a secret and
          # because waking monitoring should be two clicks, not a settings edit.
          MONITORING_MODE: ${{ github.event.inputs.monitoring_mode != 'unchanged' && github.event.inputs.monitoring_mode || '' }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_STORAGE_LIMIT_BYTES: ${{ secrets.NEON_STORAGE_LIMIT_BYTES }}
          NEON_COMPUTE_HOURS_LIMIT: ${{ secrets.NEON_COMPUTE_HOURS_LIMIT }}
          GEMINI_HOURLY_SPEND_USD: ${{ secrets.GEMINI_HOURLY_SPEND_USD }}
          GEMINI_DAILY_SPEND_USD: ${{ secrets.GEMINI_DAILY_SPEND_USD }}
          SARVAM_DAILY_SPEND_USD: ${{ secrets.SARVAM_DAILY_SPEND_USD }}
          INVOCATION_BURST_PER_5MIN: ${{ secrets.INVOCATION_BURST_PER_5MIN }}
          APIGW_4XX_PER_5MIN: ${{ secrets.APIGW_4XX_PER_5MIN }}
          OTP_VERIFICATIONS_PER_5MIN: ${{ secrets.OTP_VERIFICATIONS_PER_5MIN }}
        run: node scripts/gen-samconfig.js
      - run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

      # MonitorStalledAlarm treats missing data as breaching — absence of a monitor report IS the
      # failure it exists to detect. That makes it fire the instant it is created, because the
      # EventBridge schedule won't run the monitor for up to an hour and there is no such thing as
      # a CloudWatch grace period. One invocation here puts a MonitorRuns datapoint in the current
      # period, which is enough to keep the alarm out of ALARM (its 3-of-3 requirement can't be met
      # once one period has data) and doubles as a smoke test that the monitor actually works.
      #
      # Best-effort on purpose: if the deploy role lacks lambda:InvokeFunction the only consequence
      # is one spurious alarm email per wake, which is not worth failing an otherwise good deploy.
      - name: Seed monitor metrics
        continue-on-error: true
        run: |
          set -uo pipefail
          MODE=$(aws cloudformation describe-stacks --stack-name medical-scanner \
            --query "Stacks[0].Parameters[?ParameterKey=='MonitoringMode'].ParameterValue" --output text)
          if [ "$MODE" != "active" ]; then
            echo "MonitoringMode=$MODE — no monitor function to seed."
            exit 0
          fi
          FN=$(aws cloudformation describe-stack-resource --stack-name medical-scanner \
            --logical-resource-id MonitorFunction \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)
          echo "Invoking $FN to seed MonitorRuns..."
          aws lambda invoke --function-name "$FN" --payload '{}' \
            --cli-binary-format raw-in-base64-out /tmp/seed.json >/dev/null
          echo "monitor returned: $(cat /tmp/seed.json)"
      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # migrate.js is idempotent (CREATE TABLE IF NOT EXISTS / ON CONFLICT DO NOTHING
        # throughout) — safe to run on every deploy, not just ones that touch schema.
        run: node migrate.js

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://k6tdi2uzoh.execute-api.us-east-1.amazonaws.com/api/health)
          echo "GET /api/health -> $code"
          test "$code" = "200"
      - name: Auth-gated routes exist (401, not 404)
        run: |
          for route in "GET /api/auth/me" "PUT /api/auth/me" "GET /api/auth/keys"; do
            method=$(echo "$route" | cut -d' ' -f1)
            path=$(echo "$route" | cut -d' ' -f2)
            code=$(curl -s -o /dev/null -w "%{http_code}" -X "$method" "https://k6tdi2uzoh.execute-api.us-east-1.amazonaws.com$path")
            echo "$method $path -> $code"
            test "$code" = "401"
          done
